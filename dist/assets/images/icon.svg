      <stop offset="0%" stop-color="#00164e"/>
      <stop offset="100%" stop-color="#00236f"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6cf8bb"/>
      <stop offset="100%" stop-color="#006c49"/>
