<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SrijanDev Operations & Management Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #0f172a; --accent: #0284c7; --bg: #f8fafc; --sidebar-width: 260px; --card-border: #e2e8f0; --text-main: #1e293b; --text-muted: #64748b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: var(--sidebar-width); background-color: #ffffff; border-right: 1px solid var(--card-border); display: flex; flex-direction: column; justify-content: space-between; padding: 20px; z-index: 10; }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    .brand i { color: var(--accent); }
    .nav-menu { list-style: none; margin-top: 30px; display: flex; flex-direction: column; gap: 8px; }
    .nav-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 12px; }
    .nav-item:hover, .nav-item.active { background-color: #f1f5f9; color: var(--accent); font-weight: 600; }
    .nav-item.nav-owner { background-color: #ecfdf5; color: #047857; margin-top: 15px; border: 1px solid #a7f3d0; }
    .user-profile-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: #f1f5f9; border-radius: 8px; }
    .avatar { width: 36px; height: 36px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-size: 14px; font-weight: 600; color: var(--primary); }
    .user-role { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .main-container { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    .top-header { background: #ffffff; padding: 16px 32px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .status-badge { background: #dcfce7; color: #15803d; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .content-area { padding: 32px; flex: 1; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #ffffff; padding: 24px; border-radius: 12px; border: 1px solid var(--card-border); }
    .card h4 { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .card p { font-size: 26px; font-weight: 700; color: var(--primary); }
    .floating-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 9999; }
    .float-btn { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.15); cursor: pointer; text-decoration: none; }
    .btn-whatsapp { background-color: #25D366; }
    .btn-chatbot { background-color: var(--accent); }
    .chatbot-drawer { position: fixed; bottom: 90px; right: 24px; width: 320px; height: 400px; background: #ffffff; border: 1px solid var(--card-border); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: none; flex-direction: column; z-index: 10000; overflow: hidden; }
    .chat-header { background: var(--primary); color: #fff; padding: 14px; font-weight: 600; display: flex; justify-content: space-between; }
    .chat-body { flex: 1; padding: 14px; overflow-y: auto; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="brand"><i class="fa-solid fa-shield-halved"></i> SrijanDev</div>
      <ul class="nav-menu" id="nav-container"></ul>
    </div>
    <div class="user-profile-card">
      <div class="avatar" id="user-avatar">U</div>
      <div class="user-info">
        <span class="user-name" id="user-name-display">Loading...</span>
        <span class="user-role" id="user-role-display">Authenticated</span>
      </div>
      <i class="fa-solid fa-right-from-bracket" onclick="logout()" style="margin-left:auto; cursor:pointer; color:var(--text-muted);" title="Logout"></i>
    </div>
  </aside>
  <main class="main-container">
    <header class="top-header">
      <h3 id="header-title">Dashboard Overview</h3>
      <span class="status-badge"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> SYSTEM OPERATIONAL</span>
    </header>
    <section class="content-area" id="main-view-area"></section>
  </main>
  <div class="floating-container">
    <a href="https://wa.me/919999999999?text=Hello%20SrijanDev%20Team,%20I%20need%20assistance." target="_blank" class="float-btn btn-whatsapp" title="WhatsApp Support">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
    <div class="float-btn btn-chatbot" id="chatbot-toggle-btn" title="AI Assistant">
      <i class="fa-solid fa-robot"></i>
    </div>
  </div>
  <div class="chatbot-drawer" id="chatbot-drawer">
    <div class="chat-header">
      <span><i class="fa-solid fa-robot"></i> Support Assistant</span>
      <i class="fa-solid fa-xmark" id="chat-close-btn" style="cursor: pointer;"></i>
    </div>
    <div class="chat-body"><p>Hello! How can I assist you today?</p></div>
  </div>
  <script>
    const state = { currentUser: null, activeTab: 'dashboard', isChatbotOpen: false };
    document.addEventListener("DOMContentLoaded", () => { initApp(); });
    function initApp() { verifyUserSession(); renderNavigation(); loadActiveTab(); setupGlobalEvents(); }
    function verifyUserSession() {
      const token = localStorage.getItem("token");
      const userDataStr = localStorage.getItem("user");
      if (!token || !userDataStr) {
        return;
      }
      try {
        state.currentUser = JSON.parse(userDataStr);
        document.getElementById("user-name-display").textContent = state.currentUser.name || "Active User";
        document.getElementById("user-role-display").textContent = state.currentUser.role || "Client";
        document.getElementById("user-avatar").textContent = (state.currentUser.name || "U").charAt(0).toUpperCase();
      } catch (err) { logout(); }
    }
    function logout() { localStorage.clear(); window.location.href = "/auth.html"; }
    function renderNavigation() {
      const navContainer = document.getElementById("nav-container");
      const isOwner = state.currentUser?.role === 'owner' || state.currentUser?.role === 'superadmin';
      let navHTML = `
        <li class="nav-item ${state.activeTab === 'dashboard' ? 'active' : ''}" onclick="switchTab('dashboard')"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></li>
        <li class="nav-item ${state.activeTab === 'roster' ? 'active' : ''}" onclick="switchTab('roster')"><i class="fa-solid fa-calendar-days"></i> <span>Roster & Attendance</span></li>
        <li class="nav-item ${state.activeTab === 'patrols' ? 'active' : ''}" onclick="switchTab('patrols')"><i class="fa-solid fa-qrcode"></i> <span>Guard Patrols</span></li>
        <li class="nav-item ${state.activeTab === 'incidents' ? 'active' : ''}" onclick="switchTab('incidents')"><i class="fa-solid fa-triangle-exclamation"></i> <span>Live SOS</span></li>
        <li class="nav-item ${state.activeTab === 'reports' ? 'active' : ''}" onclick="switchTab('reports')"><i class="fa-solid fa-file-invoice"></i> <span>Reports</span></li>
      `;
      if (isOwner) { navHTML += `<li class="nav-item nav-owner ${state.activeTab === 'owner-panel' ? 'active' : ''}" onclick="switchTab('owner-panel')"><i class="fa-solid fa-crown"></i> <span>Owner SaaS Panel</span></li>`; }
      navContainer.innerHTML = navHTML;
    }
    function switchTab(tabName) { state.activeTab = tabName; renderNavigation(); loadActiveTab(); }
    function loadActiveTab() {
      const viewArea = document.getElementById("main-view-area");
      const titleArea = document.getElementById("header-title");
      if(state.activeTab === 'dashboard') {
        titleArea.textContent = "Operational Command Center";
        viewArea.innerHTML = `<div class="metrics-grid"><div class="card"><h4>Active Guards</h4><p>28 / 32</p></div><div class="card"><h4>Checkpoints</h4><p>194</p></div><div class="card"><h4>SOS Alerts</h4><p style="color:#16a34a;">0 Active</p></div><div class="card"><h4>Geofence</h4><p>99.4%</p></div></div>`;
      } else if(state.activeTab === 'roster') {
        titleArea.textContent = "Unolo Shift Scheduling & Attendance";
        viewArea.innerHTML = `<div class="card"><h3>Shift Allocation & Dynamic Geofencing</h3></div>`;
      } else if(state.activeTab === 'patrols') {
        titleArea.textContent = "Techpurple Guard Patrols & QR";
        viewArea.innerHTML = `<div class="card"><h3>Real-Time Checkpoint Scans</h3></div>`;
      } else if(state.activeTab === 'owner-panel') {
        titleArea.textContent = "Owner SaaS Panel";
        viewArea.innerHTML = `<div class="card"><h3>Manage Clients & Subscriptions</h3></div>`;
      } else {
        titleArea.textContent = state.activeTab.toUpperCase();
        viewArea.innerHTML = `<div class="card"><h3>${state.activeTab} details loading...</h3></div>`;
      }
    }
    function setupGlobalEvents() {
      const toggleBtn = document.getElementById("chatbot-toggle-btn");
      const closeBtn = document.getElementById("chat-close-btn");
      const drawer = document.getElementById("chatbot-drawer");
      toggleBtn.addEventListener("click", () => { state.isChatbotOpen = !state.isChatbotOpen; drawer.style.display = state.isChatbotOpen ? "flex" : "none"; });
      closeBtn.addEventListener("click", () => { state.isChatbotOpen = false; drawer.style.display = "none"; });
    }
  </script>
</body>
</html>
